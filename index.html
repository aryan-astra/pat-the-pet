<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Take a quiet break with a sleepy cat. Give them a gentle stroke, listen to them purr, and settle in.">
    <meta name="theme-color" content="#faf5ec">
    <title>Pat the Pet · A little cat time</title>
    <link rel="icon" href="./assets/paw.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./src/app.js"></script>
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" class="svg-library" aria-hidden="true">
      <symbol id="icon-paw" viewBox="0 0 24 24">
        <path fill="currentColor" stroke="none" d="M12 11.2c-2.1 0-3.5 1.2-4.7 2.8-1.2 1.6-3 2.7-3 4.5 0 2 1.6 3.1 3.2 3.1 1.7 0 3-1.1 4.5-1.1s2.8 1.1 4.5 1.1c1.6 0 3.2-1.1 3.2-3.1 0-1.8-1.8-2.9-3-4.5-1.2-1.6-2.6-2.8-4.7-2.8Z"/>
        <ellipse fill="currentColor" stroke="none" cx="3.8" cy="9.3" rx="2.2" ry="3.1" transform="rotate(-24 3.8 9.3)"/>
        <ellipse fill="currentColor" stroke="none" cx="8.8" cy="5.6" rx="2.3" ry="3.3" transform="rotate(-11 8.8 5.6)"/>
        <ellipse fill="currentColor" stroke="none" cx="15.2" cy="5.6" rx="2.3" ry="3.3" transform="rotate(11 15.2 5.6)"/>
        <ellipse fill="currentColor" stroke="none" cx="20.2" cy="9.3" rx="2.2" ry="3.1" transform="rotate(24 20.2 9.3)"/>
      </symbol>
      <symbol id="icon-sound" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3Zm13 0a4 4 0 0 1 0 6m2.7-8.7a8 8 0 0 1 0 11.4"/></symbol>
      <symbol id="icon-mute" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3Zm13 1 5 5m0-5-5 5"/></symbol>
      <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20.6 14.3A8.6 8.6 0 0 1 9.7 3.4 8.7 8.7 0 1 0 20.6 14.3Z"/></symbol>
      <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
      <symbol id="icon-expand" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></symbol>
      <symbol id="icon-collapse" viewBox="0 0 24 24"><path d="M4 9h5V4m11 5h-5V4M9 20v-5H4m11 5v-5h5"/></symbol>
      <symbol id="icon-hand" viewBox="0 0 24 24"><path d="M8 13V6a1.5 1.5 0 1 1 3 0v5-7a1.5 1.5 0 0 1 3 0v7-5a1.5 1.5 0 0 1 3 0v6-3a1.5 1.5 0 1 1 3 0v5.5a7 7 0 0 1-13.1 3.4l-3-4.4a1.5 1.5 0 0 1 2.5-1.7L8 14"/></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="icon-keyboard" viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="2"/><path d="M7 10h.1m4.9 0h.1m4.9 0h.1M7 14.5h10"/></symbol>
      <symbol id="icon-heart" viewBox="0 0 24 24"><path d="M20.8 5.8c-2.3-2.3-5.8-1.7-8.8 1.3C9 4.1 5.5 3.5 3.2 5.8c-2.2 2.2-1.9 5.6.5 8L12 22l8.3-8.2c2.4-2.4 2.7-5.8.5-8Z"/></symbol>
    </svg>

    <header class="site-header">
      <div class="wrap masthead">
        <a class="brand" href="./">
          <span class="brand-icon"><svg class="icon"><use href="#icon-paw"/></svg></span>
          <span>pat the pet<span class="brand-period">.</span></span>
        </a>
        <button type="button" class="sound-button" data-sound aria-pressed="false" title="Toggle purring sound">
          <svg class="icon"><use href="#icon-mute"/></svg>
          <span>Sound</span>
          <span class="sound-state" aria-hidden="true">Off</span>
        </button>
      </div>
    </header>

    <main class="wrap">
      <div class="intro">
        <h1>A little <em>cat time.</em></h1>
        <p>Stroke a sleepy cat and listen for a purr.</p>
      </div>

      <div class="layout">
        <div class="play-area">
          <section class="scene" aria-label="Cat petting scene">
            <div class="scene-room" aria-hidden="true"></div>
            <img class="cat-sprite" src="./assets/pets/miso.webp" alt="" fetchpriority="high">
            <canvas class="cat-canvas" aria-hidden="true" hidden></canvas>
            <button type="button" class="pet-surface" aria-label="Pet the cat" aria-describedby="play-instructions"></button>
            <div class="hand-halo" aria-hidden="true"><svg class="icon"><use href="#icon-hand"/></svg></div>
            <div class="scene-light" aria-hidden="true"></div>
            <div class="scene-tools">
              <button type="button" class="scene-tool fullscreen-sound" data-sound aria-label="Purring sound" aria-pressed="false" title="Toggle purring sound">
                <svg class="icon"><use href="#icon-mute"/></svg>
              </button>
              <button type="button" class="scene-tool" id="light-button" aria-label="Moonlight" aria-pressed="false" title="Moonlight">
                <svg class="icon"><use href="#icon-moon"/></svg>
              </button>
              <button type="button" class="scene-tool" id="fullscreen-button" aria-label="Fullscreen" aria-pressed="false" title="Fullscreen">
                <svg class="icon"><use href="#icon-expand"/></svg>
              </button>
            </div>
            <div class="mood-badge" aria-hidden="true">
              <span class="mood-dot"></span>
              <span id="mood-badge">Resting</span>
            </div>
          </section>
          <p class="play-instructions" id="play-instructions">
            <span class="gesture-hint"><svg class="icon"><use href="#icon-hand"/></svg> Stroke the fur or sweep outward along the tail.</span>
            <span class="keyboard-hint"><svg class="icon"><use href="#icon-keyboard"/></svg><kbd>Space</kbd> pet <kbd>T</kbd> tail</span>
          </p>
        </div>

        <aside class="companion" aria-labelledby="companion-title">
          <div class="companion-heading">
            <h2 id="companion-title">Your companion</h2>
            <svg class="icon" aria-hidden="true"><use href="#icon-paw"/></svg>
          </div>
          <div class="pet-profile">
            <div class="pet-portrait" aria-hidden="true"></div>
            <div class="pet-details" aria-live="polite">
              <h3 id="pet-name">Miso</h3>
              <p id="pet-coat">Ginger tabby</p>
            </div>
          </div>
          <fieldset class="pet-picker">
            <legend>Choose a cat</legend>
            <div class="pet-options" id="pet-options"></div>
          </fieldset>
          <div class="comfort">
            <label for="comfort-meter"><svg class="icon"><use href="#icon-heart"/></svg> Comfort</label>
            <span id="comfort-label" aria-live="polite">Relaxed</span>
            <meter class="sr-only" id="comfort-meter" min="0" max="1" value=".15">15%</meter>
            <div class="meter-track" aria-hidden="true"><span></span></div>
          </div>
          <label for="show-hand" class="hand-setting">
            <svg class="icon"><use href="#icon-hand"/></svg>
            <span>Hand guide</span>
            <input class="switch" type="checkbox" id="show-hand" role="switch" checked>
          </label>
        </aside>
      </div>
      <p class="sr-only" id="notice" role="status"></p>
      <noscript><p>Enable JavaScript to pet the cat and hear it purr.</p></noscript>
    </main>
  </body>
</html>
